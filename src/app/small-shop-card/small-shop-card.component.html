
<div id={{id}} class="image-wrapper light-mode" matTooltip="{{price.toFixed(2)}}€">
   
        <div class="vertical-container">
          <img src={{img}} alt="doener">
          <span>{{titel}}</span>
        </div>
        
          <mat-form-field class="fullL">
            <mat-label>Extras</mat-label>
            <input matInput placeholder="z.B. Scharf" [(ngModel)]="selectedExtras">
          </mat-form-field>
          <div class="test">
          <button (click)="chekout()" class="checkoutbutton" mat-raised-button>
            <mat-icon>shopping_cart_checkout</mat-icon> Sofort kaufen
          </button>
          <button (click)="addtoCart()" class="addcardbutton" mat-raised-button>
            <mat-icon>add_shopping_cart</mat-icon> in den Warenkorb
          </button>
        </div>
    
      
  </div>
